[project]
name = "aione-domain-api"
version = "0.0.0"
description = "AIOne Odoo Solution Builder domain and AI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    # The shared canonicalizer. Every content hash in the platform comes from
    # one implementation (ADR-015); a second one here would be a review defect.
    "aione-contracts",
]

[tool.uv.sources]
aione-contracts = { path = "../../packages/contracts/python", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aione_domain"]

[tool.ruff]
line-length = 100
target-version = "py312"
