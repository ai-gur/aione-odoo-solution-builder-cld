[project]
name = "aione-domain-api"
version = "0.0.0"
description = "AIOne Odoo Solution Builder domain and AI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aione_domain"]

[tool.ruff]
line-length = 100
target-version = "py312"
