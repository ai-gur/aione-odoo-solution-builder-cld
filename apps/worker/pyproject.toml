[project]
name = "aione-worker"
version = "0.0.0"
description = "AIOne Odoo Solution Builder background workers"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aione_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
