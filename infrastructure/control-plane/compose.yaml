# Local control-plane dependencies (LOCAL-DEVELOPMENT.md).
#
# Ports are deliberately non-default: this machine already runs other Odoo and
# application stacks, and a collision on 5432 would be found the hard way.
#
# Nothing here holds a real credential. Values are local-only placeholders;
# deployed environments resolve secrets through the provider named in ADR-010.

# Project name is distinct from other Odoo stacks on this machine. A shared
# name would put unrelated containers in the same project, where a "compose
# down" here would stop theirs.
name: aione-sb

services:
  postgres:
    image: postgres:17-alpine
    container_name: aione-sb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: aione_control
      # Deterministic collation, so ordering behaves the same on every machine.
      LANG: C
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aione_control"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aione-sb-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage for evidence and artifacts (ADR-012).
  storage:
    image: minio/minio:latest
    container_name: aione-sb-storage
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local_dev_only
      MINIO_ROOT_PASSWORD: local_dev_only
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mail capture, so invitation flows never reach a real inbox.
  mail:
    image: axllent/mailpit:latest
    container_name: aione-sb-mail
    ports:
      - "58125:8025"
      - "51125:1025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  storage-data:
